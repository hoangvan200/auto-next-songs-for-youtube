<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto next</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-raised: #21262d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #f85149;
      --accent-soft: rgba(248, 81, 73, .15);
      --stroke: #30363d;
    }

    :root.light {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #f6f8fa;
      --panel-raised: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --accent: #cf222e;
      --accent-soft: rgba(207, 34, 46, .15);
      --stroke: #d0d7de;
    }

    * { box-sizing: border-box; }

    body {
      width: 468px;
      min-height: 286px;
      margin: 0;
      padding: 18px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell { display: grid; gap: 20px; }

    .preview {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thumbnail {
      width: 145px;
      height: 92px;
      flex: 0 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #a7a7a7;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }

    .download-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 4px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }
    .thumbnail.has-image:hover .download-btn { opacity: 1; }
    .download-btn:hover { background: rgba(0,0,0,0.9); }

    .thumbnail img { display: none; width: 100%; height: 100%; object-fit: cover; }
    .thumbnail.has-image::before, .thumbnail.has-image::after, .thumbnail.has-image .sun { display: none; }

    .thumbnail::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 18px;
      width: 108px;
      height: 61px;
      border-radius: 8px;
      background: #444548;
    }

    .thumbnail::after {
      content: "";
      position: absolute;
      left: 28px;
      bottom: 27px;
      width: 82px;
      height: 27px;
      background: #a7a7a7;
      clip-path: polygon(0 100%, 0 60%, 30% 0, 48% 52%, 68% 7%, 100% 71%, 100% 100%);
    }

    .sun { position: absolute; z-index: 1; top: 29px; left: 36px; width: 18px; height: 18px; border-radius: 50%; background: #bdbdbd; }

    .preview-copy strong { display: block; color: var(--text); font-size: 15px; font-weight: 650; }
    .preview-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .settings { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .setting-label { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .setting-label strong { color: var(--accent); font-size: 18px; font-weight: 500; letter-spacing: -.02em; }
    .status { margin-top: 2px; color: var(--muted); font-size: 11px; }

    .switch { position: relative; width: 54px; height: 30px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .track { display: block; width: 54px; height: 30px; padding: 3px; cursor: pointer; border: 1px solid var(--stroke); border-radius: 999px; background: #2a2d33; transition: .2s ease; }
    .track::after { content: ""; display: block; width: 22px; height: 22px; border-radius: 50%; background: #aeb1b8; transition: .2s ease; }
    input:checked + .track { border-color: var(--accent); background: var(--accent-soft); }
    input:checked + .track::after { transform: translateX(24px); background: var(--accent); box-shadow: 0 0 12px var(--accent-soft); }
    input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 3px; }

    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    button { min-height: 36px; border: 1px solid var(--stroke); border-radius: 9px; background: var(--panel); color: var(--muted); cursor: pointer; font: inherit; transition: .15s ease; }
    button:hover { border-color: var(--accent); color: var(--text); background: var(--panel-raised); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon { font-size: 18px; line-height: 1; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="preview" aria-label="Extension preview">
      <div id="thumbnail" class="thumbnail" aria-hidden="true">
        <span class="sun"></span>
        <img id="videoThumbnail" alt="">
        <button id="downloadThumbnailBtn" class="download-btn" aria-label="Download thumbnail" title="Download thumbnail">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>
      <div class="preview-copy">
        <strong id="videoTitle">Auto next</strong>
        <span id="videoMeta">YouTube / YouTube Music</span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <section class="settings">
        <div class="setting-label">
          <div>
            <strong>Auto next</strong>
            <div id="statusText" class="status" role="status">Loading…</div>
          </div>
        </div>
        <label class="switch" title="Toggle automatic next playback">
          <input id="autoContinueToggle" type="checkbox" aria-label="Enable auto next">
          <span class="track"></span>
        </label>
      </section>

      <section class="settings">
        <div class="setting-label" style="width: 100%;">
          <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-start;">
            <strong>Data transfer</strong>
          </div>
          <div class="status" style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 4px;">
            <span id="dataTransferSpeed" style="color: var(--muted); font-size: 11px; width: 55px; text-align: right; font-variant-numeric: tabular-nums;">0 Kbps</span>
            <span id="dataTransferValue" style="color: var(--accent); font-weight: 600; width: 55px; text-align: right; font-variant-numeric: tabular-nums;">0 MB</span>
            <button id="dataTransferPeriodBtn" style="min-height: 18px; line-height: 1; padding: 0 6px; border-radius: 4px; font-size: 10px; height: 18px;">Today</button>
          </div>
        </div>
      </section>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <section class="settings">
        <div class="setting-label">
          <div>
            <strong>No video</strong>
            <div class="status">Play audio only</div>
          </div>
        </div>
        <label class="switch" title="Toggle audio only mode">
          <input id="audioOnlyToggle" type="checkbox" aria-label="Enable audio only">
          <span class="track"></span>
        </label>
      </section>

      <section class="settings">
        <div class="setting-label">
          <div>
            <strong>Theme</strong>
            <div class="status">Light / dark</div>
          </div>
        </div>
        <label class="switch" title="Toggle theme">
          <input id="themeToggle" type="checkbox" aria-label="Enable light theme">
          <span class="track"></span>
        </label>
      </section>
    </div>


    <nav class="controls" aria-label="Playback controls">
      <button id="prevBtn" type="button" title="Previous song"><span class="icon" aria-hidden="true">‹‹</span><span class="sr-only">Previous</span></button>
      <button id="playPauseBtn" type="button" title="Play or pause"><span id="playPauseIcon" class="icon" aria-hidden="true">▶</span><span class="sr-only">Play or pause</span></button>
      <button id="nextBtn" type="button" title="Next song"><span class="icon" aria-hidden="true">››</span><span class="sr-only">Next</span></button>
    </nav>
  </main>
  <script src="popup.js"></script>
</body>
</html>
